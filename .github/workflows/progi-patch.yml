name: progi-patch
on:
  push:
    paths:
      - .github/progi.patch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zastosuj patch
        run: |
          git apply --unidiff-zero --whitespace=nowarn .github/progi.patch
          node --check progi.user.js
          grep -m1 '@version' progi.user.js
      - name: Commit i sprzatanie
        run: |
          git config user.name "miodeq-ofc"
          git config user.email "127236338+miodeq-ofc@users.noreply.github.com"
          git rm -q .github/progi.patch .github/workflows/progi-patch.yml
          git add -A
          git commit -m "Baza > 1 MB: odczyt przez download_url, auto-zapis WME co 5 min (2.3.2)" -m "Contents API nie zwraca tresci plikow wiekszych niz 1 MB, przez co strona i skrypt nie mogly odczytac bazy. Teraz oba czytaja plik przez download_url, a zmiany z WME sa wysylane raz na 5 minut zamiast po kazdym kliknieciu." -m "🤖 Generated with Codebuff" -m "Co-Authored-By: Codebuff <noreply@codebuff.com>"
          git push origin HEAD:main
